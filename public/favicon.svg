<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Beautiful gradient matching Student (emerald), Teacher (blue), Researcher (rose) palette -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" /> <!-- emerald-500 -->
      <stop offset="50%" stop-color="#3B82F6" /> <!-- blue-500 -->
      <stop offset="100%" stop-color="#F43F5E" /> <!-- rose-500 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Main stylized brain/shield base -->
  <rect x="12" y="12" width="104" height="104" rx="28" fill="url(#grad)" opacity="0.1" stroke="url(#grad)" stroke-width="2.5" />
  
  <!-- Glowing core graduation cap -->
  <g filter="url(#glow)">
    <!-- Mortarboard Diamond -->
    <polygon points="64,34 98,48 64,62 30,48" fill="url(#grad)" />
    <!-- Cap base -->
    <path d="M45,56 L45,72 C45,79 53,85 64,85 C75,85 83,79 83,72 L83,56" fill="none" stroke="url(#grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Tassel -->
    <path d="M64,48 L86,59 L86,74" fill="none" stroke="#F43F5E" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="86" cy="76" r="3.5" fill="#F43F5E" />
  </g>
  
  <!-- AI Sparkles -->
  <path d="M34,26 L35.5,30.5 L40,32 L35.5,33.5 L34,38 L32.5,33.5 L28,32 L32.5,30.5 Z" fill="#10B981" />
  <path d="M94,84 L95.2,87.5 L99,89 L95.2,90.5 L94,94 L92.8,90.5 L89,89 L92.8,87.5 Z" fill="#F43F5E" />
  <path d="M88,24 L88.8,26.5 L91.5,27.2 L88.8,28 L88,30.5 L87.2,28 L84.5,27.2 L87.2,26.5 Z" fill="#3B82F6" />
</svg>
